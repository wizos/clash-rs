[package]
name = "clash-rs"
repository = { workspace = true }
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }

[features]
default = ["standard", "aws-lc-rs", "dashboard"]
standard = ["shadowsocks", "tuic", "ssh", "sudoku", "shadowquic", "wireguard", "openvpn", "tailscale", "clash-lib/zero_copy", "tproxy", "tun", "redir"]

plus = ["standard", "onion"]
perf = ["plus", "jemallocator"]

android = ["shadowsocks", "tuic", "aws-lc-rs", "wireguard", "openvpn", "clash-lib/zero_copy", "tproxy"] # Android build failed with libc
bsd = ["shadowsocks", "tuic", "ring", "clash-lib/zero_copy", "tun"]  # enable tun via FIB multi-table routing

shadowsocks = ["clash-lib/shadowsocks"]
masque = ["clash-lib/masque"]
mieru = ["clash-lib/mieru"]
ssh = ["clash-lib/ssh"]
sudoku = ["clash-lib/sudoku"]
tuic = ["clash-lib/tuic"]
onion = ["clash-lib/onion"]
shadowquic = ["clash-lib/shadowquic"]
wireguard = ["clash-lib/wireguard"]
openvpn = ["clash-lib/openvpn"]
tailscale = ["clash-lib/tailscale"]
utls = ["clash-lib/utls"]
tproxy = ["clash-lib/tproxy"]
redir = ["clash-lib/redir"]
tun = ["clash-lib/tun"]

bench = ["clash-lib/bench"]
dashboard = ["clash-lib/dashboard"]
dhat-heap = ["dep:dhat"]
telemetry = ["clash-lib/telemetry"]
jemallocator = ["dep:tikv-jemallocator"]

aws-lc-rs = ["dep:aws-lc-rs", "clash-lib/aws-lc-rs"]
ring = ["clash-lib/ring"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

clash-lib = { path = "../clash-lib", default-features = false }

dhat = { version = "0.3", optional = true }
tikv-jemallocator = { version = "0.7", optional = true }

sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
human-panic = "2.0"


aws-lc-rs = { version = "1.16", optional = true, default-features = false }
